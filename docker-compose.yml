services:

  backend:
    build: .
    container_name: factoryflow-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/factoryflow?replicaSet=rs0
      JWT_SECRET: change_this_later
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: factoryflow-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo-init:
    image: mongo:8
    container_name: factoryflow-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("Replica set already initialized");
          } catch (e) {
            rs.initiate({
              _id: "rs0",
              members: [
                { _id: 0, host: "mongo:27017" }
              ]
            });
            print("Replica set initialized");
          }
        '
    restart: "no"

volumes:
  mongo_data: